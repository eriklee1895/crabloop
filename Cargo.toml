[package]
name = "crabloop"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "A small coding-agent harness that grows step by step in Rust"
repository = "https://github.com/eriklee1895/crabloop"
publish = false

[dependencies]
anyhow = "=1.0.104"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "process", "io-util", "time"] }
